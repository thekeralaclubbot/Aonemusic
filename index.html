<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Node Music</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
/* BASIC RESET */
body {
  font-family: 'Poppins', sans-serif;
  margin: 0;
  padding: 0;
  background-color: #f4f7fa;
  color: #333;
  padding-bottom: 70px;
}

/* HEADER */
.app-header {
  background-color: #1e88e5;
  color: white;
  padding: 15px 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  border-bottom-left-radius: 15px;
  border-bottom-right-radius: 15px;
  box-shadow: 0 4px 6px rgba(0,0,0,0.1);
  position: sticky;
  top: 0;
  z-index: 10;
}

.logo-container {
  display: flex;
  align-items: center;
}

.logo {
  width: 30px;
  height: 30px;
  margin-right: 10px;
  border-radius: 5px;
  background-color: #ffb300;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
}

.app-title {
  font-size: 1.5em;
  font-weight: 600;
}

.search-bar-container {
  display: flex;
  border: 1px solid #fff;
  border-radius: 20px;
  overflow: hidden;
  background-color: white;
  width: 100%;
}

.search-input {
  flex-grow: 1;
  padding: 8px 15px;
  border: none;
  outline: none;
  font-size: 1em;
}

.search-button {
  background-color: #ffb300;
  color: white;
  border: none;
  padding: 8px 15px;
  cursor: pointer;
  font-size: 1.2em;
}

/* AD SECTION */
.ad-section { padding: 20px; }
.ad-banner {
  width: 100%;
  height: 150px;
  background-size: cover;
  background-position: center;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.4em;
  color: white;
  font-weight: 700;
  transition: opacity .4s;
}

.ad-text-overlay {
  background: rgba(0,0,0,.4);
  padding: 8px 20px;
  border-radius: 8px;
}

/* MUSIC CARDS */
.content-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(250px,1fr));
  gap: 20px;
  padding: 20px;
}

.music-card {
  background: white;
  border-radius: 10px;
  padding: 15px;
  box-shadow: 0 4px 8px rgba(0,0,0,.1);
  transition: transform .2s;
}

.music-card:hover { transform: translateY(-5px); }

.cover-art img {
  width: 100%;
  border-radius: 10px;
}

.card-controls {
  margin-top: 10px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.control-button {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: none;
  cursor: pointer;
  font-size: 1.1em;
  display: flex;
  align-items: center;
  justify-content: center;
}

.play-button { background: #ffb300; color: white; }
.download-button { background: #28a745; color: white; }

.song-title {
  flex-grow: 1;
  font-weight: 600;
}

/* NOW PLAYING BAR */
.now-playing-bar {
  position: fixed;
  bottom: 0;
  width: 100%;
  height: 60px;
  background: #333;
  color: white;
  display: flex;
  align-items: center;
  padding: 0 20px;
  transform: translateY(100%);
  transition: transform .3s;
}

.now-playing-bar.visible {
  transform: translateY(0);
}

.np-details {
  display: flex;
  align-items: center;
  flex-grow: 1;
}

.np-cover {
  width: 40px;
  height: 40px;
  background: #ffb300;
  margin-right: 10px;
  border-radius: 5px;
  display: flex;
  align-items: center;
  justify-content: center;
}

</style>
</head>
<body>

<!-- HEADER -->
<header class="app-header">
  <div class="logo-container">
      <div class="logo">NM</div>
      <span class="app-title">Node Music</span>
  </div>

  <div class="search-bar-container">
      <input id="searchInput" class="search-input" placeholder="Search songs...">
      <button class="search-button">🔍</button>
  </div>
</header>

<!-- ADS -->
<section class="ad-section">
  <div id="adCarouselContainer" class="ad-banner">
      <div id="adText" class="ad-text-overlay"></div>
  </div>
</section>

<!-- MUSIC GRID -->
<main id="musicGrid" class="content-grid"></main>

<!-- NOW PLAYING BAR -->
<div id="nowPlayingBar" class="now-playing-bar">
  <div class="np-details">
      <div class="np-cover">🎵</div>
      <div>
          <div id="npTitle" class="np-title"></div>
          <div class="np-artist">Simulated Playback</div>
      </div>
  </div>
  <button onclick="stopPlayback()" style="background:#dc3545;color:white;font-size:1.3em;border-radius:50%;width:35px;height:35px;">⏹</button>
</div>

<script>
/* SONG LIST */
const songs = [
  { title: "Ilakozhiye", coverFile: "to.jpg", audioFile: "Ilakozhiye.mp3" },
  { title: "Nera", coverFile: "to.jpg", audioFile: "Nera.mp3" },
  { title: "Shariya", coverFile: "shariya.jpg", audioFile: "shariya.mp3" },
  { title: "Hope Song", coverFile: "hope.jpg", audioFile: "hope_song.mp3" },
  { title: "Jaalakaari", coverFile: "jaalakaari.jpg", audioFile: "jaalakaari.mp3" },
  { title: "Kaadhal Ponmaan", coverFile: "kaadhal_ponmaan.jpg", audioFile: "kaadhal_ponmaan.mp3" },
  { title: "Kannukulla", coverFile: "kannukulla.jpg", audioFile: "kannukulla.mp3" },
  { title: "Kozhipunk", coverFile: "kozhipunk.jpg", audioFile: "kozhipunk.mp3" },
  { title: "Madhuramoorunna", coverFile: "madhuramoorunna.jpg", audioFile: "madhuramoorunna.mp3" },
  { title: "Maine Pyar Kiya", coverFile: "maine.jpg", audioFile: "maine-pyar-kiya.mp3" },
  { title: "Mhr Munthirichar", coverFile: "mhr.jpg", audioFile: "mhr_munthirichar.mp3" },
  { title: "Neeyorikkal", coverFile: "neeyorikkal.jpg", audioFile: "neeyorikkal.mp3" },
  { title: "Oorum Blood", coverFile: "oorum-blood.jpg", audioFile: "oorum-blood.mp3" },
  { title: "Pemari", coverFile: "pemari.jpg", audioFile: "pemari.mp3" },
  { title: "Permaani", coverFile: "permaani.jpg", audioFile: "permaani.mp3" }
];

/* ADS */
const ads = [
  { title: "Ad 1: New Album Drop",      file: "ad1.jpg" },
  { title: "Ad 2: Exclusive Concert",   file: "ad2.jpg" },
  { title: "Ad 3: Upgrade to Premium",  file: "ad3.jpg" },
  { title: "Ad 4: Music Gear Offers",   file: "ad4.jpg" },
  { title: "Ad 5: Podcast Network",     file: "ad5.jpg" },
  { title: "Ad 6: Yearly Sale Event",   file: "ad6.jpg" }
];

let currentAdIndex = 0;
let audioContext = null;
let oscillator = null;

/* RENDER SONG CARD */
const createMusicCard = (song) => {
  const card = document.createElement("div");
  card.classList.add("music-card");

  card.innerHTML = `
    <div class="cover-art">
      <img src="${song.coverFile}" onerror="this.src='https://placehold.co/150x150?text=No+Image'">
    </div>

    <div class="card-controls">
      <button class="control-button play-button" data-action="play" data-title="${song.title}">▶</button>
      <button class="control-button download-button" data-action="download" data-title="${song.title}">⬇</button>
      <p class="song-title">${song.title}</p>
    </div>
  `;
  return card;
};

/* RENDER GRID */
const renderMusicGrid = () => {
  const grid = document.getElementById("musicGrid");
  grid.innerHTML = "";
  songs.forEach(song => grid.appendChild(createMusicCard(song)));
};

/* AD CAROUSEL */
const updateAdBanner = () => {
  const ad = ads[currentAdIndex];
  const banner = document.getElementById("adCarouselContainer");
  const text = document.getElementById("adText");

  banner.style.opacity = "0";
  setTimeout(() => {
    banner.style.backgroundImage = `url('${ad.file}')`;
    text.textContent = ad.title;
    banner.style.opacity = "1";
  }, 300);

  currentAdIndex = (currentAdIndex + 1) % ads.length;
};

setInterval(updateAdBanner, 2000);

/* AUDIO SIMULATED PLAYBACK */
const playTone = () => {
  if (!audioContext) audioContext = new AudioContext();

  oscillator = audioContext.createOscillator();
  const gain = audioContext.createGain();

  oscillator.connect(gain);
  gain.connect(audioContext.destination);

  oscillator.frequency.value = 520;
  oscillator.start();
  oscillator.stop(audioContext.currentTime + 0.5);
};

/* NOW PLAYING BAR */
const startPlayback = (title) => {
  document.getElementById("npTitle").textContent = title;
  document.getElementById("nowPlayingBar").classList.add("visible");
  playTone();
};

function stopPlayback() {
  document.getElementById("nowPlayingBar").classList.remove("visible");
  if (oscillator) oscillator.stop();
}

/* ENABLE AUDIO ON MOBILE CLICK */
document.body.addEventListener("click", () => {
  if (audioContext && audioContext.state === "suspended") audioContext.resume();
}, { once: true });

/* SEARCH */
document.getElementById("searchInput").addEventListener("input", (e) => {
  const term = e.target.value.toLowerCase();
  document.querySelectorAll(".music-card").forEach(card => {
    card.style.display = card.innerText.toLowerCase().includes(term) ? "block" : "none";
  });
});

/* BUTTON ACTIONS */
document.addEventListener("click", (e) => {
  const btn = e.target.closest(".control-button");
  if (!btn) return;

  const action = btn.dataset.action;
  const title = btn.dataset.title;
  const song = songs.find(s => s.title === title);

  if (action === "play") startPlayback(title);
  if (action === "download") {
    const a = document.createElement("a");
    a.href = song.audioFile;
    a.download = song.audioFile;
    a.click();
  }
});

/* INIT */
document.addEventListener("DOMContentLoaded", () => {
  renderMusicGrid();
  updateAdBanner();
});
</script>

</body>
</html>
