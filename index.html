<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Node Music</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body{
  font-family:'Poppins',sans-serif;margin:0;padding:0;
  background:#f4f7fa;padding-bottom:70px;color:#333;
}

/* HEADER */
.app-header{
  background:#1e88e5;color:#fff;padding:15px 20px;
  display:flex;flex-direction:column;gap:10px;
  position:sticky;top:0;z-index:10;
  border-bottom-left-radius:15px;border-bottom-right-radius:15px;
  box-shadow:0 4px 6px rgba(0,0,0,.1)
}

/* 📌 FIXED FULL LOGO VISIBLE */
.logo-img{
  width:70px;
  height:70px;
  object-fit:contain;     /* FULL LOGO SHOW */
  background:white;
  border-radius:12px;
  padding:5px;
  margin-right:12px;
}

/* SEARCH BAR */
.search-bar-container{
  display:flex;border:1px solid #fff;background:#fff;
  border-radius:20px;overflow:hidden
}
.search-input{
  flex-grow:1;padding:8px 15px;border:none;outline:none
}
.search-button{
  background:#ffb300;color:#fff;border:none;padding:8px 15px;cursor:pointer
}

/* ADS */
.ad-section{padding:20px}
.ad-banner{
  width:100%;
  max-width:100%;
  height:150px;
  border-radius:12px;
  background-size:cover;
  background-position:center;
  display:flex;align-items:center;justify-content:center;
  font-size:1.4em;color:#fff;font-weight:700;
  overflow:hidden;
}

/* MUSIC GRID */
.content-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:20px;padding:20px
}
.music-card{
  background:#fff;border-radius:10px;padding:15px;
  box-shadow:0 4px 8px rgba(0,0,0,.1)
}
.cover-art img{
  width:100%;border-radius:10px;object-fit:cover;height:180px
}
.card-controls{
  margin-top:10px;display:flex;align-items:center;gap:10px
}
.control-button{
  width:36px;height:36px;border-radius:50%;
  border:none;cursor:pointer;font-size:1.2em;
  display:flex;align-items:center;justify-content:center
}
.play-button{background:#ffb300;color:#fff}
.download-button{background:#28a745;color:#fff}
.song-title{flex-grow:1;font-weight:600}

/* NOW PLAYING BAR */
.now-playing-bar{
  position:fixed;bottom:0;width:100%;height:60px;
  background:#333;color:#fff;display:flex;align-items:center;
  padding:0 20px;transform:translateY(100%);
  transition:transform .3s
}
.now-playing-bar.visible{transform:translateY(0)}
.np-cover{
  width:40px;height:40px;background:#ffb300;margin-right:10px;
  border-radius:5px;display:flex;align-items:center;justify-content:center
}

/* Pause Button */
.pause-btn{
  background:#ffb300;
  color:#fff;
  border:none;
  border-radius:50%;
  width:35px;height:35px;
  font-size:1.3em;
  margin-left:10px;
}
</style>
</head>

<body>

<header class="app-header">
  <div style="display:flex;align-items:center;">
    <img src="logo.jpg" class="logo-img" alt="Logo">
    <span class="app-title" style="font-size:1.4em;font-weight:700;">Node Music</span>
  </div>

  <div class="search-bar-container">
    <input id="searchInput" class="search-input" placeholder="Search songs...">
    <button class="search-button">🔍</button>
  </div>
</header>

<section class="ad-section">
  <div id="adCarouselContainer" class="ad-banner">
    <div id="adText"></div>
  </div>
</section>

<main id="musicGrid" class="content-grid"></main>

<div id="nowPlayingBar" class="now-playing-bar">
  <div class="np-cover">🎵</div>
  <div id="npTitle"></div>

  <button id="pauseBtn" class="pause-btn">⏸</button>

  <button id="stopBtn"
    style="margin-left:10px;background:#dc3545;color:white;border:none;border-radius:50%;
    width:35px;height:35px;font-size:1.3em">⏹</button>
</div>

<audio id="audioPlayer"></audio>

<script>

/* SONG LIST */
const songs = [
  { title: "Ilakozhiye", coverFile: "Ilakozhiye.jpg", audioFile: "Ilakozhiye.mp3" },
  { title: "Nera", coverFile: "nera.jpg", audioFile: "Nera.mp3" },
  { title: "Shariya", coverFile: "shariya.jpg", audioFile: "Shariya.mp3" },
  { title: "Hope Song", coverFile: "hope.jpg", audioFile: "hope_song.mp3" },
  { title: "Jaalakaari", coverFile: "jaalakaari.jpg", audioFile: "jaalakaari.mp3" },
  { title: "Kaadhal Ponmaan", coverFile: "kaadhal_ponmaan.jpg", audioFile: "kaadhal_ponmaan.mp3" },
  { title: "Kannukulla", coverFile: "kannukulla.jpg", audioFile: "kannukulla.mp3" },
  { title: "Kozhipunk", coverFile: "kozhipunk.jpg", audioFile: "kozhipunk.mp3" },
  { title: "Singari", coverFile: "singari.jpg", audioFile: "singari.mp3" },
  { title: "Thani Lokah Murakkaari", coverFile: "thani-lokah-murakkaari.jpg", audioFile: "thani-lokah-murakkaari.mp3" },
  { title: "Oorum Blood", coverFile: "oorum-blood.jpg", audioFile: "oorum-blood.m4a" },
  { title: "Munthirichar", coverFile: "mhr.jpg", audioFile: "mhr_munthirichar.mp3" }
];

/* ADS */
const ads = [
  { title: "", file: "ad4.jpg" },
  { title: "", file: "ad2.jpg" },
  { title: "", file: "ad3.jpg" }
];
let currentAd = 0;

/* CREATE MUSIC CARD */
const createMusicCard = (song) => {
  const card = document.createElement("div");
  card.className = "music-card";

  card.innerHTML = `
    <div class="cover-art">
      <img src="${song.coverFile}" onerror="this.src='https://placehold.co/200x200?text=No+Image'">
    </div>

    <div class="card-controls">
      <button class="control-button play-button" data-audio="${song.audioFile}" data-title="${song.title}">▶</button>
      <button class="control-button download-button" data-audio="${song.audioFile}">⬇</button>
      <p class="song-title">${song.title}</p>
    </div>
  `;
  return card;
};

/* RENDER GRID */
function renderMusicGrid() {
  const grid = document.getElementById("musicGrid");
  songs.forEach(song => grid.appendChild(createMusicCard(song)));
}

// --- VITAL CHANGES FOR AUTO-PLAY NEXT SONG ---

let isPaused = false;
// 1. Track the index of the currently playing song in the 'songs' array
let currentSongIndex = -1; 

const audioPlayer = document.getElementById("audioPlayer");

/**
 * Plays a song by file and title, and updates the currentSongIndex.
 */
function playSong(file, title) {
  audioPlayer.src = file;
  audioPlayer.play();

  document.getElementById("npTitle").textContent = title;
  document.getElementById("nowPlayingBar").classList.add("visible");

  isPaused = false;
  document.getElementById("pauseBtn").innerHTML = "⏸";

  // 2. Find the index of the song that was just played and store it
  const index = songs.findIndex(song => song.audioFile === file);
  if (index !== -1) {
    currentSongIndex = index;
  }
}

/**
 * Logic to play the next song in the playlist, looping back to the start.
 */
function playNextSong() {
  if (currentSongIndex === -1) return; 

  // Calculate the index of the next song using modulo to loop
  const nextIndex = (currentSongIndex + 1) % songs.length;
  const nextSong = songs[nextIndex];

  if (nextSong) {
    playSong(nextSong.audioFile, nextSong.title);
  }
}

// 3. Attach event listener: when the audio finishes playing, call playNextSong
audioPlayer.addEventListener('ended', playNextSong);

// --- END OF AUTO-PLAY CHANGES ---


/* PAUSE / RESUME */
document.getElementById("pauseBtn").onclick = () => {
  if (isPaused) {
    audioPlayer.play();
    document.getElementById("pauseBtn").innerHTML = "⏸";
    isPaused = false;
  } else {
    audioPlayer.pause();
    document.getElementById("pauseBtn").innerHTML = "▶";
    isPaused = true;
  }
};

/* STOP */
document.getElementById("stopBtn").onclick = () => {
  audioPlayer.pause();
  audioPlayer.currentTime = 0;
  document.getElementById("nowPlayingBar").classList.remove("visible");
  currentSongIndex = -1; // Reset index when stopped
};

/* ACTIONS */
document.addEventListener("click", (e) => {
  const btn = e.target.closest(".control-button");
  if (!btn) return;

  const file = btn.dataset.audio;
  const title = btn.dataset.title;

  if (btn.classList.contains("play-button")) {
    playSong(file, title); 
  }

  if (btn.classList.contains("download-button")) {
    const a = document.createElement("a");
    a.href = file;
    a.download = file;
    a.click();
  }
});

/* SEARCH */
document.getElementById("searchInput").addEventListener("input", (e) => {
  const term = e.target.value.toLowerCase();
  document.querySelectorAll(".music-card").forEach(card => {
    card.style.display = card.innerText.toLowerCase().includes(term) ? "block" : "none";
  });
});

/* ROTATE ADS */
function rotateAds() {
  const ad = ads[currentAd];
  document.getElementById("adCarouselContainer").style.backgroundImage = `url('${ad.file}')`;
  document.getElementById("adText").textContent = ad.title;
  currentAd = (currentAd + 1) % ads.length;
}
setInterval(rotateAds, 2500);

/* INIT */
document.addEventListener("DOMContentLoaded", () => {
  renderMusicGrid();
  rotateAds();
});

</script>

</body>
</html>
