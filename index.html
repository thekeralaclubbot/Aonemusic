<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Node Music</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
body {font-family:'Poppins',sans-serif;margin:0;padding:0;background:#f4f7fa;padding-bottom:70px;color:#333}
.app-header{background:#1e88e5;color:#fff;padding:15px 20px;display:flex;flex-direction:column;gap:10px;position:sticky;top:0;z-index:10;border-bottom-left-radius:15px;border-bottom-right-radius:15px;box-shadow:0 4px 6px rgba(0,0,0,.1)}
.logo{width:30px;height:30px;background:#ffb300;border-radius:5px;margin-right:10px;display:flex;align-items:center;justify-content:center;font-weight:700}
.search-bar-container{display:flex;border:1px solid #fff;background:#fff;border-radius:20px;overflow:hidden}
.search-input{flex-grow:1;padding:8px 15px;border:none;outline:none}
.search-button{background:#ffb300;color:#fff;border:none;padding:8px 15px;cursor:pointer}
.ad-section{padding:20px}
.ad-banner{width:100%;height:150px;background-size:cover;background-position:center;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.4em;color:#fff;font-weight:700;transition:opacity .4s}
.content-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;padding:20px}
.music-card{background:#fff;border-radius:10px;padding:15px;box-shadow:0 4px 8px rgba(0,0,0,.1)}
.cover-art img{width:100%;border-radius:10px}
.card-controls{margin-top:10px;display:flex;align-items:center;gap:10px}
.control-button{width:32px;height:32px;border-radius:50%;border:none;cursor:pointer;font-size:1.1em;display:flex;align-items:center;justify-content:center}
.play-button{background:#ffb300;color:#fff}
.download-button{background:#28a745;color:#fff}
.song-title{flex-grow:1;font-weight:600}
.now-playing-bar{position:fixed;bottom:0;width:100%;height:60px;background:#333;color:#fff;display:flex;align-items:center;padding:0 20px;transform:translateY(100%);transition:transform .3s}
.now-playing-bar.visible{transform:translateY(0)}
.np-cover{width:40px;height:40px;background:#ffb300;margin-right:10px;border-radius:5px;display:flex;align-items:center;justify-content:center}
</style>
</head>

<body>

<header class="app-header">
  <div style="display:flex;align-items:center;">
    <div class="logo">NM</div>
    <span class="app-title">Node Music</span>
  </div>

  <div class="search-bar-container">
      <input id="searchInput" class="search-input" placeholder="Search songs...">
      <button class="search-button">🔍</button>
  </div>
</header>

<section class="ad-section">
  <div id="adCarouselContainer" class="ad-banner">
      <div id="adText"></div>
  </div>
</section>

<main id="musicGrid" class="content-grid"></main>

<div id="nowPlayingBar" class="now-playing-bar">
  <div class="np-cover">🎵</div>
  <div id="npTitle"></div>
  <button id="stopBtn" style="margin-left:auto;background:#dc3545;color:white;border:none;border-radius:50%;width:35px;height:35px;font-size:1.3em">⏹</button>
</div>

<audio id="audioPlayer"></audio>

<script>
/* SONG LIST — You can add unlimited songs here */
const songs = [
  { title: "Ilakozhiye", coverFile: "Ilakozhiye.jpg", audioFile: "Ilakozhiye.mp3" },
  { title: "Nera", coverFile: "Nera.jpg", audioFile: "Nera.mp3" },
  { title: "Shariya", coverFile: "shariya.jpg", audioFile: "shariya.mp3" },
  { title: "Hope Song", coverFile: "hope.jpg", audioFile: "hope_song.mp3" },
  { title: "Jaalakaari", coverFile: "jaalakaari.jpg", audioFile: "jaalakaari.mp3" },
  { title: "Kaadhal Ponmaan", coverFile: "kaadhal_ponmaan.jpg", audioFile: "kaadhal_ponmaan.mp3" },
  { title: "Kannukulla", coverFile: "kannukulla.jpg", audioFile: "kannukulla.mp3" },
  { title: "Kozhipunk", coverFile: "kozhipunk.jpg", audioFile: "kozhipunk.mp3" }
];

/* ADS */
const ads = [
  { title: "", file: "ad1.jpg" },
  { title: "", file: "ad2.jpg" },
  { title: "", file: "ad3.jpg" }
];
let currentAd = 0;

/* RENDER CARD */
const createMusicCard = (song) => {
  const card = document.createElement("div");
  card.className = "music-card";

  card.innerHTML = `
    <div class="cover-art">
      <img src="${song.coverFile}" onerror="this.src='https://placehold.co/200x200?text=No+Image'">
    </div>

    <div class="card-controls">
      <button class="control-button play-button" data-audio="${song.audioFile}" data-title="${song.title}">▶</button>
      <button class="control-button download-button" data-audio="${song.audioFile}">⬇</button>
      <p class="song-title">${song.title}</p>
    </div>
  `;
  return card;
};

/* RENDER GRID */
function renderMusicGrid() {
  const grid = document.getElementById("musicGrid");
  songs.forEach(song => grid.appendChild(createMusicCard(song)));
}

/* PLAY SONG */
function playSong(file, title) {
  const audio = document.getElementById("audioPlayer");
  audio.src = file;
  audio.play();

  document.getElementById("npTitle").textContent = title;
  document.getElementById("nowPlayingBar").classList.add("visible");
}

/* STOP */
document.getElementById("stopBtn").onclick = () => {
  const audio = document.getElementById("audioPlayer");
  audio.pause();
  audio.currentTime = 0;
  document.getElementById("nowPlayingBar").classList.remove("visible");
};

/* CLICK ACTIONS */
document.addEventListener("click", (e) => {
  const btn = e.target.closest(".control-button");
  if (!btn) return;

  const file = btn.dataset.audio;
  const title = btn.dataset.title;

  if (btn.classList.contains("play-button")) {
    playSong(file, title);
  }

  if (btn.classList.contains("download-button")) {
    const a = document.createElement("a");
    a.href = file;
    a.download = file;
    a.click();
  }
});

/* SEARCH */
document.getElementById("searchInput").addEventListener("input", (e) => {
  const term = e.target.value.toLowerCase();
  document.querySelectorAll(".music-card").forEach(card => {
    card.style.display = card.innerText.toLowerCase().includes(term) ? "block" : "none";
  });
});

/* ADS CAROUSEL */
function rotateAds() {
  const ad = ads[currentAd];
  document.getElementById("adCarouselContainer").style.backgroundImage = `url('${ad.file}')`;
  document.getElementById("adText").textContent = ad.title;
  currentAd = (currentAd + 1) % ads.length;
}
setInterval(rotateAds, 2000);

/* INIT */
document.addEventListener("DOMContentLoaded", () => {
  renderMusicGrid();
  rotateAds();
});
</script>

</body>
</html>
